<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>slopTV</title>
<style>
  :root{color-scheme:dark;--fg:#d8d8d8;--dim:#8a8a8a;--accent:#78e8c3}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--fg);font:13px/1.35 system-ui,sans-serif;overflow:hidden}
  body.idle{cursor:none}
  #stage{position:fixed;inset:0;display:flex;justify-content:center}
  iframe{border:0;width:100%;max-width:550px;height:100%;background:#000;color-scheme:dark}
  #prog{position:fixed;left:0;bottom:0;height:2px;width:0;background:var(--accent);opacity:.7;pointer-events:none}
  .card{position:fixed;bottom:14px;width:min(270px,28vw);display:flex;gap:9px;align-items:center;padding:7px;border:0;border-radius:10px;
    background:rgba(18,18,20,.72);color:var(--fg);font:inherit;text-align:left;cursor:pointer;
    backdrop-filter:blur(6px);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .25s,transform .25s,background .15s}
  body.ui .card:not(.empty){opacity:1;transform:none;pointer-events:auto}
  body.ui .card:not(.empty):hover{background:rgba(34,34,38,.88)}
  #cp{left:14px}#cn{right:14px;flex-direction:row-reverse;text-align:right}
  .card img{width:72px;height:41px;object-fit:cover;border-radius:6px;background:#1c1c1e;flex:none}
  .card .t{min-width:0;font-size:12px}
  .card b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .c{display:block;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card em{display:block;font-style:normal;color:var(--accent);font-size:11px}
  #toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:rgba(18,18,20,.8);
    color:var(--fg);font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1}
  #notice{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000}
  #notice div{max-width:440px;padding:16px 18px;border:1px solid #2a2a2e;border-radius:12px;color:var(--dim);font-size:12.5px;line-height:1.5}
  #notice button{margin-top:10px;margin-right:6px;background:#1c1c1e;color:var(--fg);border:1px solid #333;border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit}
  #notice button:hover{border-color:var(--accent)}
</style>
<div id="stage"><iframe id="f" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe></div>
<div id="prog"></div>
<button class="card empty" id="cp"><img alt=""><span class="t"><b></b><span class="c"></span></span></button>
<button class="card empty" id="cn"><img alt=""><span class="t"><b></b><span class="c"></span><em></em></span></button>
<div id="toast"></div>
<div id="notice"><div>
  This plays each post in X's own embedded player, unmodified. The window loads X's scripts and media, and X may set cookies in slopTV's private browser profile (not your normal one). It asks X not to personalise (dnt=true) but X's player decides the rest.
  <br><button id="ok">OK</button><button id="no">Quit</button>
</div></div>
<script>
const base = location.pathname.replace(/[^\/]*$/, '');
const $ = id => document.getElementById(id);
async function api(p, post) {
  const r = await fetch(base + 'api/' + p, post ? {method: 'POST'} : {});
  return r.json();
}
// TIMER-BEGIN (pure logic, unit-tested with node and a fake clock)
function makeTimer(graceMs) {
  return {
    total: 0, t0: 0, frozen: 0, paused: false, running: false,
    start(durSecs, on, now) {
      this.total = (on && durSecs > 0) ? durSecs * 1000 + graceMs : 0;
      this.t0 = now; this.frozen = 0; this.paused = false; this.running = this.total > 0;
    },
    // pause freezes the elapsed time; resume continues from the remaining time (no restart)
    pause(now) { if (this.running && !this.paused) { this.frozen = this.elapsed(now); this.paused = true; } },
    resume(now) { if (this.running && this.paused) { this.t0 = now - this.frozen; this.paused = false; } },
    elapsed(now) { return this.paused ? this.frozen : now - this.t0; },
    left(now) { return Math.max(0, this.total - this.elapsed(now)); },
    due(now) {
      if (!this.running || this.paused || this.elapsed(now) < this.total) return false;
      this.running = false;
      return true;
    },
  };
}
// TIMER-END
const GRACE = 1000;
const T = makeTimer(GRACE);
let st = null, P = false, uiUntil = 0, idleT = 0, toastT = 0;
function toast(msg, keep) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); if (!keep) toastT = setTimeout(() => t.classList.remove('on'), 1800);
}
function showUi(ms) { uiUntil = Math.max(uiUntil, Date.now() + ms); document.body.classList.add('ui'); document.body.classList.remove('idle'); }
function card(el, c) {
  el.classList.toggle('empty', !c);
  if (!c) return;
  const img = el.querySelector('img');
  if (c.poster) { if (img.dataset.src !== c.poster) { img.dataset.src = c.poster; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.src = c.poster; } img.style.visibility = 'visible'; }
  else { img.removeAttribute('src'); delete img.dataset.src; img.style.visibility = 'hidden'; }
  el.querySelector('b').textContent = '@' + c.creator;
  el.querySelector('.c').textContent = c.caption;
  const e = el.querySelector('em'); if (e) e.textContent = c.wraps ? '\u21bb loops to start' : '';
}
// (re)start the countdown for the clip on screen; called when the embed has loaded and on next/prev/auto
function arm() { setPaused(false, true); T.start(st && !st.notice ? st.duration_secs : 0, st && st.auto, Date.now()); tick(); }
function setPaused(on, quiet) {
  P = on;
  if (on) T.pause(Date.now()); else T.resume(Date.now());
  if (!quiet) { if (on) { toast('paused', true); showUi(1e9); } else { $('toast').classList.remove('on'); uiUntil = Date.now() + 1500; } }
  tick();
}
function tick() {
  const pf = $('prog');
  const now = Date.now();
  if (document.body.classList.contains('ui') && !P && now > uiUntil) document.body.classList.remove('ui');
  if (!P && now - idleT > 3000) document.body.classList.add('idle');
  if (!st || st.notice || !st.auto || !st.duration_secs) { pf.style.width = '0'; return; }
  pf.style.width = Math.min(100, T.elapsed(now) * 100 / (T.total || 1)) + '%';
  if (!P && T.due(now)) go('next');
}
function show(s) {
  const changed = !st || st.id !== s.id;
  st = s;
  $('notice').style.display = s.notice ? 'flex' : 'none';
  if (!s.notice && $('f').dataset.id !== s.id) { $('f').dataset.id = s.id; $('f').src = s.embed; }
  card($('cp'), s.prev); card($('cn'), s.next);
  if (changed && !s.notice) showUi(3500);
  return changed;
}
$('f').onload = () => arm();
function go(p) { return api(p, true).then(s => { show(s); if (['auto', 'next', 'prev', 'ack'].includes(p)) arm(); return s; }); }
addEventListener('blur', () => setTimeout(() => { if (document.activeElement === $('f')) setPaused(true); }, 0));
addEventListener('mousemove', () => { idleT = Date.now(); showUi(2200); });
addEventListener('focus', () => { if (P) setPaused(false); });
setInterval(tick, 250);
$('cp').onclick = () => go('prev'); $('cn').onclick = () => go('next');
$('ok').onclick = () => go('ack'); $('no').onclick = () => go('quit');
function fullscreen() {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
}
addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.key;
  idleT = Date.now();
  if (k === 'l' || k === 'ArrowRight' || k === 'n') go('next');
  else if (k === 'h' || k === 'ArrowLeft') go('prev');
  else if (k === 's') go('shuffle').then(s => toast(s.shuffle ? 'shuffle on' : 'shuffle off'));
  else if (k === 'a') go('auto').then(s => toast(s.auto ? 'auto-advance on' : 'auto-advance off'));
  else if (k === 'p' || k === ' ') { setPaused(!P); e.preventDefault(); }
  else if (k === 'f') { go('like'); toast('opening like page on X'); }
  else if (k === 'o') { go('open'); toast('opening post on X'); }
  else if (k === 'w') fullscreen();
  else if (k === 'q') go('quit');
});
api('state').then(s => { show(s); arm(); });
setInterval(() => fetch(base + 'api/ping').catch(() => {}), 3000);
</script>
