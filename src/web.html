<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>slopTV</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font:15px -apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#zones{position:absolute;inset:0 0 120px 0;display:flex}#zones div{flex:1}
#attr{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .4s}
#attr .t{font-weight:700}#attr .h{opacity:.7;margin-left:6px}#attr .c{margin:4px 0;max-height:3.9em;overflow:hidden}
#attr a{color:#1d9bf0;text-decoration:none}
#bar{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;display:flex;gap:6px;transition:opacity .4s}
#bar button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 12px;font-size:16px}
.idle #bar,.idle #attr{opacity:0}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:14px;z-index:5}
#start button{font-size:22px;padding:16px 34px;border-radius:40px;border:0;background:#fff;color:#000;font-weight:700}
#start p{opacity:.6;max-width:30em;text-align:center;padding:0 20px;font-size:13px}
#msg{position:absolute;top:40%;width:100%;text-align:center;font-size:28px;pointer-events:none;opacity:0;transition:opacity .3s}
</style></head><body>
<div id="stage">
  <video id="v" playsinline webkit-playsinline preload="auto"></video>
  <div id="zones"><div data-z="prev"></div><div data-z="pause"></div><div data-z="next"></div></div>
  <div id="msg"></div>
  <div id="bar"><button id="bPrev">⏮</button><button id="bPause">⏯</button><button id="bNext">⏭</button><button id="bShuf">🔀</button><button id="bFs">⛶</button></div>
  <div id="attr"><div><span class="t" id="aT"></span><span class="h" id="aH"></span></div><div class="c" id="aC"></div><a id="aL" target="_blank" rel="noopener">View post on X</a></div>
  <div id="start"><button id="go">▶ Tap to play</button><p id="st">Loading queue…</p><p>slopTV · unofficial, not affiliated with X. Videos belong to their creators; open each post on X to like or follow.</p></div>
</div>
<script src="/app.js"></script></body></html>
