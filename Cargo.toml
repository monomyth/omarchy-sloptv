[package]
name = "slop-tv"
version = "0.1.0"
edition = "2021"
description = "slopTV: keyboard-driven player for Slop Cannon videos (libmpv)"
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "slop-tv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
libmpv2 = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.0.7"
ureq = "3.2.1"
