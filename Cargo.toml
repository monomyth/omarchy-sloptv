[package]
name = "slop-tv"
version = "0.1.0"
edition = "2021"
description = "slopTV: keyboard-driven player for Slop Cannon videos (libmpv)"
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "slop-tv"
path = "src/main.rs"

[features]
# Default build includes the hidden, unofficial raw-mpv mode (needs libmpv at build time).
# `--no-default-features` builds the embed-only controller (no libmpv, no image decoding).
default = ["raw-mpv"]
raw-mpv = ["dep:libmpv2", "dep:image"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
image = { optional = true, version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
libmpv2 = { version = "6.0.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.0.7"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
ureq = "3.2.1"
